name: Scan Greenhouse EU-remote jobs

on:
  schedule:
    # GitHub cron is UTC.
    # Europe/Stockholm in januari (wintertijd) = UTC+1
    # 07:00 Stockholm -> 06:00 UTC
    # 15:00 Stockholm -> 14:00 UTC
    # - cron: "0 6 * * *"
    # - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dateutil

      - name: Run scanner
        run: |
          python scripts/scan_greenhouse.py --boards boards.yaml --outdir output --debug


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: greenhouse-output
          path: output/

      - name: Commit output to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/jobs.json output/jobs.md || true

          # Alleen committen als er wijzigingen zijn
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Greenhouse EU-remote jobs (auto)"
          git push
